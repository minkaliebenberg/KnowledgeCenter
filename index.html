<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CrownRing Knowledge Center</title>
  <meta name="description" content="Prototype of the CrownRing Knowledge Center: Learn, Know, Ask and Manage.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
/* CrownRing Knowledge Center — prototype styles.
   Colour tokens on :root so the developer can map them to the internal site's theme. */
/* Palette: "Navy and Gold" — Deep Navy #0A1A40, Navy #1A3070, Pale Gold #E8C870; antique gold #C5A04C and a lighter cream #FBF8F1 */
:root {
  --bg: #fbf8f1; --surface: #fffdf9; --surface-2: #f3eee3; --text: #0a1a40; --muted: #5d6680; --border: #e7e0cf;
  --accent: #c5a04c; --accent-hover: #b39041; --on-accent: #0a1a40; --accent-strong: #1a3070; --accent-soft: #f3e8cf;
  --mark: #e8c870; --navy: #0a1a40; --slate: #1a3070; --cream: #f8f0dc;
  --header-bg: #0a1a40; --header-text: #f8f0dc; --header-muted: #b3b9cc; --header-hover: rgba(248,240,220,.08); --demo-bg: #1a3070;
  --ok: #4e7a5e; --ok-soft: #e6ece0; --warn: #8f6a2c; --warn-soft: #f3ead6; --info: #1a3070; --info-soft: #e3e7f1;
  --danger: #9a4a48; --danger-soft: #f3dfd6;
  --radius: 12px; --shadow: 0 1px 2px rgba(10,26,64,.05), 0 2px 12px rgba(10,26,64,.06);
  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; --serif: 'Cormorant Garamond', Georgia, serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1a40; --surface: #10234f; --surface-2: #1a3070; --text: #f8f0dc; --muted: #b3b9cc; --border: #26407f;
    --accent: #e8c870; --accent-hover: #f0d68c; --on-accent: #0a1a40; --accent-strong: #e8c870; --accent-soft: #2a3358; --mark: #e8c870; --navy: #f8f0dc; --slate: #2c4a9a;
    --header-bg: #071230; --header-text: #f8f0dc; --header-muted: #b3b9cc; --header-hover: rgba(248,240,220,.08); --demo-bg: #1a3070;
    --ok: #9cc7a6; --ok-soft: #1c3a35; --warn: #e8c870; --warn-soft: #3a3423; --info: #b9c6ea; --info-soft: #1a3070;
    --danger: #e8a39b; --danger-soft: #42263a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1a40; --surface: #10234f; --surface-2: #1a3070; --text: #f8f0dc; --muted: #b3b9cc; --border: #26407f;
  --accent: #e8c870; --accent-hover: #f0d68c; --on-accent: #0a1a40; --accent-strong: #e8c870; --accent-soft: #2a3358; --mark: #e8c870; --navy: #f8f0dc; --slate: #2c4a9a;
  --header-bg: #071230; --header-text: #f8f0dc; --header-muted: #b3b9cc; --header-hover: rgba(248,240,220,.08); --demo-bg: #1a3070;
  --ok: #9cc7a6; --ok-soft: #1c3a35; --warn: #e8c870; --warn-soft: #3a3423; --info: #b9c6ea; --info-soft: #1a3070;
  --danger: #e8a39b; --danger-soft: #42263a; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.55 var(--font); -webkit-font-smoothing: antialiased; }
a { color: var(--accent-strong); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3 { line-height: 1.25; margin: 0 0 .4em; }
h1 { font-family: var(--serif); font-weight: 600; font-size: 2rem; margin-top: .2em; }
h2 { font-size: 1.1rem; font-weight: 600; }
h3 { font-size: .95rem; font-weight: 600; }
p { margin: 0 0 .8em; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* demo bar + header */
.demo-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; padding: 5px 16px; background: var(--demo-bg); color: var(--header-text); font-size: 12px; }
.demo-bar select { width: auto; max-width: 100%; background: #f8f0dc; color: #0a1a40; border: 0; border-radius: 6px; padding: 2px 6px; font-size: 12px; }
.demo-bar .link-btn { color: var(--header-text); font-size: 12px; }
.link-btn { background: none; border: 0; padding: 0; cursor: pointer; color: var(--accent-strong); }
.link-btn:hover { text-decoration: underline; }
.topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 16px; padding: 12px 24px; background: var(--header-bg); border-bottom: 1px solid rgba(232,200,112,.35); }
.brand { display: flex; align-items: center; gap: 10px; color: var(--header-text); }
.brand:hover { text-decoration: none; }
.brand-mark { color: var(--mark); display: grid; place-items: center; }
.brand-text { display: flex; flex-direction: column; line-height: 1.05; }
.brand-name { font-family: var(--serif); font-size: 1.35rem; font-weight: 600; }
.brand-sub { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--mark); }
.mainnav { display: flex; gap: 2px; margin-left: 12px; flex: 1; overflow-x: auto; }
.mainnav a { padding: 8px 14px; border-radius: 999px; color: var(--muted); font-weight: 500; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.mainnav a { color: var(--header-muted); }
.mainnav a:hover { background: var(--header-hover); color: var(--header-text); text-decoration: none; }
.mainnav a.active { background: rgba(232,200,112,.16); color: #e8c870; box-shadow: inset 0 0 0 1px rgba(232,200,112,.45); }
.topbar .btn-ghost { color: var(--header-text); border-color: rgba(238,236,224,.25); }
.topbar .btn-ghost:hover { background: var(--header-hover); }
.count { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 11px; font-weight: 600; margin-left: 4px; vertical-align: middle; font-family: var(--font); }

main { max-width: 1080px; margin: 0 auto; padding: 24px 24px 80px; outline: none; }
.narrow { max-width: 760px; margin: 0 auto; }

/* primitives */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 16px; border-radius: 8px; border: 1px solid transparent; background: var(--accent); color: var(--on-accent); font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--accent-hover); text-decoration: none; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-ghost { background: transparent; color: var(--text); border-color: var(--border); }
.btn-ghost:hover { background: var(--surface-2); }
.btn-sm { padding: 5px 12px; font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.center { text-align: center; }
.nowrap { white-space: nowrap; }
.meta { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--muted); vertical-align: middle; white-space: nowrap; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.info { background: var(--info-soft); color: var(--info); }
.badge.danger { background: var(--danger-soft); color: var(--danger); }
.pill-row { display: flex; flex-wrap: wrap; gap: 6px; }
.pill-row.center { justify-content: center; }
.chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 13px; color: var(--text); font-weight: 400; }
.chip:hover { background: var(--surface-2); text-decoration: none; }
.chip.active { background: var(--slate); color: var(--cream); border-color: var(--slate); }
.chip-n { opacity: .6; margin-left: 2px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.spread { justify-content: space-between; }
.row.end { justify-content: flex-end; margin-top: 16px; }
.grow { flex: 1; min-width: 0; }
.stack > * + * { margin-top: 14px; }
.stack > .card { margin-bottom: 0; }
.empty { text-align: center; padding: 28px; color: var(--muted); }
.section-title { margin: 28px 0 10px; display: flex; align-items: center; gap: 4px; }
input[type=text], input[type=search], select, textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
textarea { min-height: 110px; resize: vertical; }
textarea.short { min-height: 70px; }
label { font-weight: 500; font-size: 14px; display: block; margin-bottom: 4px; }
.field + .field, .grid-2col + .field, .field + .grid-2col { margin-top: 12px; }
.grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid-2col .field + .field { margin-top: 0; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }
.table-wrap { overflow-x: auto; }
.card.table-wrap { padding: 6px 8px; }

/* progress */
.progress { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; flex: 1; }
.progress > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s; }
.big-bar { display: flex; align-items: center; gap: 14px; margin-top: 12px; }
.big-bar .progress { height: 12px; }
.big-bar .pct { font-family: var(--serif); font-size: 1.8rem; font-weight: 600; color: var(--navy); line-height: 1; min-width: 64px; text-align: right; }
.big-bar .small-pct { font-size: 1.1rem; }
.cell-pct { min-width: 100px; }
.cell-pct .progress { height: 5px; margin-top: 5px; }

/* lists (learn to-do, know files) */
.card.list { padding: 4px 0; }
.list-row { display: flex; align-items: center; gap: 14px; padding: 12px 18px; color: var(--text); border-top: 1px solid var(--border); }
.list-row:first-child, summary + .list-row { border-top: 0; }
a.list-row:hover { background: var(--surface-2); text-decoration: none; }
.list-row .sub { display: block; font-size: 13px; color: var(--muted); font-weight: 400; }
.row-ico { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--accent-soft); color: var(--navy); font-size: 13px; font-weight: 700; }
.row-ico.warn { background: var(--accent); color: var(--on-accent); }
.row-ico.ok { background: var(--ok-soft); color: var(--ok); }
.row-ico.plain { background: transparent; font-size: 17px; border-radius: 8px; }
details.completed summary { padding: 12px 18px; cursor: pointer; color: var(--muted); font-weight: 500; }
details.completed[open] summary { border-bottom: 1px solid var(--border); }

/* module player / reading */
.player-head { margin-bottom: 14px; }
.player-head .row { margin: 6px 0 8px; }
.nav-btns { margin-top: 4px; }
.doc-body h2 { margin-top: 1.4em; font-size: 1.05rem; }
.doc-body h2:first-child { margin-top: .4em; }
.doc-body ul { padding-left: 1.3em; margin: 0 0 .8em; }
.doc-body li { margin-bottom: .3em; }
.doc-body.diff h3 { margin-top: 1em; }
.doc-actions { margin-bottom: 8px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
.related-h { margin-top: 28px; }
details.history { margin-top: 24px; font-size: 14px; }
details.history summary, details summary { cursor: pointer; color: var(--muted); }
details.history ul { padding-left: 1.2em; margin-top: 8px; }
.changes { background: var(--warn-soft); border-radius: 10px; padding: 14px 16px; }
.changes p { margin: 4px 0 0; }
.result { padding: 12px 16px; border-radius: 10px; display: flex; gap: 12px; align-items: center; justify-content: space-between; margin-top: 16px; }
.result.ok { background: var(--ok-soft); color: var(--ok); }
.result.warn { background: var(--warn-soft); color: var(--warn); }
.quiz-q { padding: 12px 0; }
.opt { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; margin: 8px 0 0; cursor: pointer; font-weight: 400; }
.opt:hover { background: var(--surface-2); }
.opt.correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--danger); }
#submitQuiz { margin-top: 12px; }
.diff-del { background: var(--danger-soft); color: var(--danger); text-decoration: line-through; }
.diff-add { background: var(--ok-soft); color: var(--ok); }

/* know */
.search-big { position: relative; max-width: 720px; margin: 8px auto 24px; }
.search-big input { padding: 14px 18px 14px 46px; font-size: 16px; border-radius: 999px; box-shadow: var(--shadow); }
.search-big::before { content: '⌕'; position: absolute; left: 18px; top: 50%; transform: translateY(-52%); font-size: 20px; color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.tile { display: flex; flex-direction: column; gap: 4px; padding: 18px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); box-shadow: var(--shadow); transition: border-color .12s, transform .12s; }
.tile:hover { border-color: var(--accent); transform: translateY(-1px); text-decoration: none; }
.tile-ico { font-size: 22px; margin-bottom: 4px; }
/* mute colourful emoji icons to fit the palette */
.tile-ico, .row-ico.plain { filter: grayscale(1) sepia(.55) saturate(1.3) opacity(.85); }
mark { background: var(--accent-soft); color: inherit; padding: 0 2px; border-radius: 3px; }

/* ask */
.ask { display: flex; flex-direction: column; min-height: calc(100vh - 220px); }
.ask-hello { text-align: center; margin: 8vh 0 20px; }
.chat { display: flex; flex-direction: column; gap: 12px; flex: 1; }
.msg { max-width: 85%; padding: 12px 16px; border-radius: 16px; }
.msg p:last-child, .msg ul:last-child { margin-bottom: 0; }
.msg.user { align-self: flex-end; background: var(--slate); color: var(--cream); border-bottom-right-radius: 4px; }
.msg.bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.msg .source { margin-top: 10px; font-size: 13px; color: var(--muted); }
.chat-input { display: flex; gap: 8px; margin-top: 18px; position: sticky; bottom: 12px; background: var(--bg); padding: 6px 0; }
.chat-input input { flex: 1; border-radius: 999px; padding: 12px 18px; }
.chat-input .btn { border-radius: 999px; }

/* manage */
.manage-head { margin-bottom: 16px; }
.tabs { display: flex; gap: 2px; }
.tabs a { padding: 8px 16px; color: var(--muted); border-radius: 8px; font-weight: 500; display: inline-flex; align-items: center; }
.tabs a:hover { background: var(--surface-2); text-decoration: none; }
.tabs a.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); border: 1px solid var(--border); }
.toolbar { margin-bottom: 12px; }
.toolbar input { max-width: 240px; }
.grid-main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; margin-top: 8px; }
.details dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0 0 12px; font-size: 14px; }
.details dt { color: var(--muted); }
.details dd { margin: 0; }
.label { margin: 10px 0 4px; text-transform: uppercase; letter-spacing: .05em; font-size: 11px; }
.link-line { display: block; font-size: 14px; padding: 2px 0; }
.section-editor { border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 10px; background: var(--surface-2); }
.section-editor .row { flex-wrap: nowrap; margin-bottom: 8px; }
.section-editor .sec-h { font-weight: 600; }
.radio-card { display: flex; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-weight: 400; margin-top: 8px; }
.radio-card:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.warn-box { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 10px 12px; }
.board { display: grid; grid-template-columns: repeat(6, minmax(158px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 8px; align-items: start; }
.col { background: var(--surface-2); border-radius: var(--radius); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 120px; }
.col.requests { background: var(--warn-soft); }
.col-head { font-weight: 600; font-size: 13px; padding: 2px 4px 4px; display: flex; align-items: center; gap: 6px; }
.kcard { display: flex; flex-direction: column; gap: 8px; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 13px; width: 100%; cursor: pointer; color: var(--text); }
.kcard p { margin: 0; }
.kcard .sub { color: var(--muted); font-size: 12px; }
.kcard .pill-row { gap: 4px; }
.col.requests .kcard { cursor: default; }
button.kcard:hover { border-color: var(--accent); }

/* modal + toast */
.modal { position: fixed; inset: 0; background: rgba(10,12,20,.45); display: grid; place-items: center; padding: 16px; z-index: 50; }
.modal[hidden] { display: none; }
.modal-card { background: var(--surface); border-radius: 14px; padding: 24px; width: min(520px, 100%); max-height: 90vh; overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--header-bg); color: var(--header-text); padding: 10px 18px; border-radius: 10px; opacity: 0; transition: all .25s; z-index: 60; max-width: calc(100% - 32px); pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media print { .demo-bar, .topbar, .doc-actions, details.history, .small:first-child { display: none !important; } .card { border: 0; box-shadow: none; } }

@media (max-width: 760px) {
  .topbar { flex-wrap: wrap; padding: 10px 16px; gap: 8px; }
  .mainnav { order: 3; flex-basis: 100%; margin-left: 0; }
  .suggest-btn { margin-left: auto; }
  .hide-sm { display: none; }
  main { padding: 16px 16px 60px; }
  h1 { font-size: 1.6rem; }
  .grid-main { grid-template-columns: 1fr; }
  .grid-2col { grid-template-columns: 1fr; }
  .tiles { grid-template-columns: 1fr 1fr; }
  .list-row { padding: 12px 14px; gap: 10px; }
  .list-row .btn { display: none; }
  .list-row .nowrap.small { display: none; }
  .msg { max-width: 92%; }
  .toolbar input { max-width: none; }
}

</style>
</head>
<body>
  <div class="demo-bar" role="note">
    <span><strong>Prototype</strong> · placeholder content · viewing as</span>
    <select id="userSwitch" aria-label="Switch demo user"></select>
    <button class="link-btn" id="resetDemo" type="button">Reset demo</button>
  </div>

  <header class="topbar">
    <a class="brand" href="#/learn" aria-label="Knowledge Center home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="28" height="28"><path d="M5 22 3 9l7 5 6-9 6 9 7-5-2 13z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M6 26h20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </span>
      <span class="brand-text"><span class="brand-name">CrownRing</span><span class="brand-sub">Knowledge Center</span></span>
    </a>
    <nav class="mainnav" id="mainnav" aria-label="Knowledge Center sections"></nav>
    <button class="btn btn-ghost suggest-btn" id="suggestBtn" type="button" title="Send a question, idea or document request to L&amp;D">
      <span aria-hidden="true">✎</span><span class="hide-sm"> Submit a Request</span>
    </button>
  </header>

  <main id="app" tabindex="-1"></main>

  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
/* =============================================================================
   CrownRing Knowledge Center — SEED DATA (prototype only)
   -----------------------------------------------------------------------------
   Folder names and document titles mirror the real SharePoint library and the
   L&D Documentation Map. ALL DOCUMENT TEXT IS PLACEHOLDER — the real content
   lives in SharePoint. People (other than Minka) are fictional.
   In production this would live in a database (see docs/DATA-MODEL.md).
   ========================================================================== */
(function () {
  // compact helpers for seed content
  const sec = (h, body) => ({ h, body });
  const ver = (v, date, type, summary, sections, extra) => Object.assign({ v, date, type, summary, sections, status: 'archived', by: 'u5' }, extra || {});
  const doc = (o) => Object.assign({ status: 'active', sourceOfTruth: false, links: [], tags: [], depts: ['NC'], owner: 'u5' }, o, {
    versions: o.versions.map((x, i, a) => Object.assign(x, { status: i === a.length - 1 ? (o.status === 'draft' || o.status === 'review' ? 'draft' : 'current') : 'archived' })),
  });
  const ph = 'Placeholder text — see the SharePoint version for the real content.';

  window.SEED = {
    today: '2026-11-09',

    departments: [
      { id: 'NC', name: 'Noam Carver Team' },
      { id: 'CS', name: 'Customer Service' },
      { id: 'PR', name: 'Production' },
      { id: 'AR', name: 'Accounting' },
    ],

  <script>
/* =============================================================================
   Store + business rules.
   In production these rules belong on the server (see docs/DATA-MODEL.md).
   The prototype keeps state in memory and mirrors it to localStorage so a demo
   survives a refresh. "Reset demo" restores the seed data.
   ========================================================================== */
(function () {
  const KEY = 'crownring-kc-demo-v2';
  const clone = (o) => JSON.parse(JSON.stringify(o));

  let state;
  try { state = JSON.parse(localStorage.getItem(KEY)); } catch (e) { state = null; }
  if (!state || !state.documents) state = Object.assign(clone(window.SEED), { currentUser: 'u1' });

  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* demo still works in memory */ } }
  function reset() { state = Object.assign(clone(window.SEED), { currentUser: state.currentUser || 'u1' }); save(); }

  const STAGE_ORDER = ['foundation', 'products', 'path', 'ongoing'];
  const STAGE_LABEL = { foundation: 'Onboarding', products: 'Onboarding', path: 'Department', ongoing: 'Ongoing' };

  const S = {
    get state() { return state; },
    save, reset, STAGE_LABEL,
    user: (id) => state.users.find((u) => u.id === id),
    me: () => state.users.find((u) => u.id === state.currentUser),
    setMe: (id) => { state.currentUser = id; save(); },
    dept: (id) => (state.departments.find((d) => d.id === id) || { name: id }).name,
    folder: (id) => state.folders.find((f) => f.id === id),
    doc: (id) => state.documents.find((d) => d.id === id),
    mod: (id) => state.modules.find((m) => m.id === id),
    current: (doc) => doc.versions.find((v) => v.status === 'current'),
    latest: (doc) => doc.versions[doc.versions.length - 1],
    deptNames: (list) => (list.includes('ALL') ? 'Everyone' : list.map((d) => S.dept(d)).join(', ')),
    isAdmin: (u) => u.role === 'admin',
    canSeeTeam: (u) => u.role === 'admin' || u.role === 'supervisor',
  };

  const appliesTo = (depts, u) => depts.includes('ALL') || depts.includes(u.dept);
  S.appliesTo = appliesTo;

  /* ---------- KNOW / ASK: current, active documents for the user's department ---------- */
  S.visibleDocs = (u) => state.documents.filter((d) => d.status === 'active' && S.current(d) && (S.isAdmin(u) || appliesTo(d.depts, u)));

  /* ---------- LEARN ---------- */
  S.done = (userId, kind, ref) => state.completions.find((c) => c.user === userId && c.kind === kind && c.ref === ref);

  S.requiredModules = (u) => state.modules
    .filter((m) => appliesTo(m.depts, u))
    .sort((a, b) => STAGE_ORDER.indexOf(a.stage) - STAGE_ORDER.indexOf(b.stage));

  /* A pushed update is required when:
     1. the document applies to the user's department,
     2. the user started before it was published, and
     3. no unfinished module already teaches that document (they'll learn the new version there).
     Only the newest pushed version is required; older acknowledgements stay on record. */
  S.requiredUpdates = (u) => {
    const mods = S.requiredModules(u);
    const out = [];
    state.documents.forEach((d) => {
      if (d.status !== 'active' || !appliesTo(d.depts, u)) return;
      const v = S.current(d);
      if (!v || !v.pushed || u.start >= v.date) return;
      if (mods.some((m) => m.docs.includes(d.id) && !S.done(u.id, 'module', m.id))) return;
      out.push({ doc: d, version: v, ref: d.id + '@' + v.v });
    });
    return out;
  };

  /* Ordered to-do list: updates first (they're time-sensitive), then modules in stage order. */
  S.todo = (u) => [
    ...S.requiredUpdates(u).filter((x) => !S.done(u.id, 'update', x.ref)).map((x) => ({ kind: 'update', x })),
    ...S.requiredModules(u).filter((m) => !S.done(u.id, 'module', m.id)).map((m) => ({ kind: 'module', m })),
  ];

  S.progress = (u) => {
    const mods = S.requiredModules(u), ups = S.requiredUpdates(u);
    const total = mods.length + ups.length;
    const done = mods.filter((m) => S.done(u.id, 'module', m.id)).length + ups.filter((x) => S.done(u.id, 'update', x.ref)).length;
    const group = (stages) => { const ms = mods.filter((m) => stages.includes(m.stage)); return { done: ms.filter((m) => S.done(u.id, 'module', m.id)).length, total: ms.length }; };
    return { total, done, pct: total ? Math.round((done / total) * 100) : 100,
      onboarding: group(['foundation', 'products']), path: group(['path']),
      updatesPending: ups.filter((x) => !S.done(u.id, 'update', x.ref)).length };
  };

  S.complete = (userId, kind, ref, score) => {
    if (S.done(userId, kind, ref)) return;
    state.completions.push({ user: userId, kind, ref, date: state.today, score });
    save();
  };

  S.transcript = (u) => state.completions.filter((c) => c.user === u.id).sort((a, b) => (a.date < b.date ? 1 : -1));

  /* ---------- MANAGE ---------- */
  S.nextVersion = (cur, type) => {
    if (cur.startsWith('0.')) return '1.0';
    const [maj, min] = cur.split('.').map(Number);
    return type === 'major' ? (maj + 1) + '.0' : maj + '.' + (min + 1);
  };

  /* Publishing archives the previous current version (never deletes it). */
  S.publish = (docId, { sections, type, summary, pushed, by, depts }) => {
    const d = S.doc(docId);
    const prev = S.current(d) || S.latest(d);
    const isNew = !S.current(d);
    const v = isNew ? '1.0' : S.nextVersion(prev.v, type);
    d.versions = d.versions.filter((x) => x.status !== 'draft');
    d.versions.forEach((x) => { if (x.status === 'current') x.status = 'archived'; });
    d.versions.push({ v, date: state.today, type: isNew ? 'initial' : type, by, status: 'current', pushed: !!pushed, summary, sections });
    if (depts && depts.length) d.depts = depts;
    d.status = 'active';
    const nr = new Date(state.today + 'T12:00:00'); nr.setFullYear(nr.getFullYear() + 1);
    d.nextReview = nr.toISOString().slice(0, 10);
    state.roadmap.forEach((r) => { if (r.docId === docId && r.status !== 'done') r.status = 'done'; });
    save();
    return v;
  };

  S.retire = (docId) => { S.doc(docId).status = 'retired'; save(); };
  S.restore = (docId) => { S.doc(docId).status = 'active'; save(); };

  S.linkedFrom = (docId) => state.documents.filter((d) => d.links.includes(docId) && d.status !== 'retired');

  /* Employees who must acknowledge a pushed version, and who has. */
  S.ackStats = (d, v) => {
    const ref = d.id + '@' + v.v;
    const need = state.users.filter((u) => u.role !== 'admin' && appliesTo(d.depts, u) && u.start < v.date);
    const acked = state.completions.filter((c) => c.kind === 'update' && c.ref === ref);
    return { need, acked, pending: need.filter((u) => !acked.some((c) => c.user === u.id)) };
  };

  S.reviewState = (d) => {
    if (!d.nextReview || d.status !== 'active') return null;
    if (d.nextReview < state.today) return 'overdue';
    const soon = new Date(state.today + 'T12:00:00'); soon.setDate(soon.getDate() + 60);
    return d.nextReview <= soon.toISOString().slice(0, 10) ? 'soon' : null;
  };

  S.submit = (userId, type, text) => {
    state.submissions.unshift({ id: 'S' + Date.now(), user: userId, type, text, date: state.today, status: 'new' });
    save();
  };

  S.team = (u) => (u.role === 'admin' ? state.users.filter((x) => x.role !== 'admin') : state.users.filter((x) => x.supervisor === u.id));

  S.transfer = (userId, newDept) => {
    const u = S.user(userId);
    if (u.dept === newDept) return;
    const from = u.deptHistory.length ? u.deptHistory[u.deptHistory.length - 1].to : u.start;
    u.deptHistory.push({ dept: u.dept, from, to: state.today });
    u.dept = newDept;
    save();
  };

  /* ---------- ASK: simulated retrieval over CURRENT, ACTIVE docs only ---------- */
  const STOP = new Set('a an the is are was were be to of and or in on for with what how do does i we our my me can when who where which should if it this that at by from any about need you have get as there their they them your'.split(' '));
  const stem = (w) => w.replace(/(ing|ed|es|s)$/, '');
  const tokens = (t) => (t.toLowerCase().match(/[a-z0-9]+/g) || []).filter((w) => !STOP.has(w) && w.length > 1).map(stem);
  const isPlaceholder = (s) => /^Placeholder text/.test(s.body);

  S.ask = (u, question) => {
    const q = tokens(question);
    if (!q.length) return { found: false };
    const hits = [];
    S.visibleDocs(u).forEach((d) => {
      const v = S.current(d);
      const titleT = tokens(d.title + ' ' + d.tags.join(' '));
      v.sections.forEach((s, idx) => {
        if (isPlaceholder(s)) return;
        const body = tokens(s.h + ' ' + s.body);
        let score = 0;
        q.forEach((w) => {
          if (titleT.includes(w)) score += 2;
          const n = body.filter((b) => b === w).length;
          if (n) score += 1 + Math.min(n, 3) * 0.5;
        });
        const coverage = q.filter((w) => titleT.includes(w) || body.includes(w)).length / q.length;
        hits.push({ d, v, s, idx, score: score * coverage, coverage });
      });
    });
    hits.sort((a, b) => b.score - a.score);
    const top = hits[0];
    if (!top || top.score < 2.5 || top.coverage < 0.5) return { found: false };
    return { found: true, top };
  };

  window.Store = S;
})();

  <script>
/* =============================================================================
   CrownRing Knowledge Center — prototype UI (plain JS, hash routing, no build)
   Routes:
     #/learn  #/learn/module/:id[/:step]  #/learn/update/:docId  #/learn/record
     #/know   #/know/f/:folderId   #/know/doc/:id
     #/ask
     #/team   #/team/:userId
     #/manage (register)  #/manage/doc/:id  #/manage/doc/:id/v/:ver  #/manage/edit/:id  #/manage/roadmap
   ========================================================================== */
(function () {
  const S = window.Store;
  const app = document.getElementById('app');
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtDate = (d) => d ? new Date(d + 'T12:00:00').toLocaleDateString('en-CA', { year: 'numeric', month: 'short', day: 'numeric' }) : '—';
  const firstName = (u) => u.name.split(' ')[0];

  /* ---------- tiny markdown: paragraphs, "- " bullets, **bold** ---------- */
  function md(text) {
    const inline = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    return String(text).split(/\n{2,}/).map((block) => {
      const lines = block.split('\n');
      if (lines.every((l) => l.trim().startsWith('- '))) return '<ul>' + lines.map((l) => '<li>' + inline(l.trim().slice(2)) + '</li>').join('') + '</ul>';
      return '<p>' + lines.map(inline).join('<br>') + '</p>';
    }).join('');
  }
  const plain = (text) => String(text).replace(/\*\*/g, '').replace(/^- /gm, '• ');
  const docBody = (v) => v.sections.map((s, i) => `<h2 id="sec-${i}">${esc(s.h)}</h2>${md(s.body)}`).join('');

  /* ---------- word diff for "exact changes" ---------- */
  function wordDiff(a, b) {
    const A = plain(a).split(/(\s+)/), B = plain(b).split(/(\s+)/);
    const n = A.length, m = B.length;
    const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    let i = 0, j = 0, out = '';
    while (i < n && j < m) {
      if (A[i] === B[j]) { out += esc(A[i]); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) { out += '<span class="diff-del">' + esc(A[i]) + '</span>'; i++; }
      else { out += '<span class="diff-add">' + esc(B[j]) + '</span>'; j++; }
    }
    while (i < n) out += '<span class="diff-del">' + esc(A[i++]) + '</span>';
    while (j < m) out += '<span class="diff-add">' + esc(B[j++]) + '</span>';
    return out.replace(/\n/g, '<br>');
  }
  function sectionDiff(oldV, newV) {
    if (!oldV) return '<p class="muted">No previous version.</p>';
    const heads = [...new Set([...oldV.sections.map((s) => s.h), ...newV.sections.map((s) => s.h)])];
    return heads.map((h) => {
      const a = oldV.sections.find((s) => s.h === h), b = newV.sections.find((s) => s.h === h);
      if (!a) return `<h3>${esc(h)} <span class="badge ok">New</span></h3><p class="diff-add">${esc(plain(b.body)).replace(/\n/g, '<br>')}</p>`;
      if (!b) return `<h3>${esc(h)} <span class="badge warn">Removed</span></h3><p class="diff-del">${esc(plain(a.body)).replace(/\n/g, '<br>')}</p>`;
      if (a.body === b.body) return '';
      return `<h3>${esc(h)}</h3><p>${wordDiff(a.body, b.body)}</p>`;
    }).join('') || '<p class="muted">No wording changes.</p>';
  }
  const prevVersion = (d, v) => d.versions.slice(0, d.versions.indexOf(v)).reverse().find((x) => x.status === 'archived');

  /* ---------- UI helpers ---------- */
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400);
  }
  function openModal(html, onMount) {
    const m = $('#modal'); $('.modal-card', m).innerHTML = html; m.hidden = false;

    if (onMount) onMount($('.modal-card', m));
  }
  function closeModal() { $('#modal').hidden = true; }
  $('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal' || e.target.closest('[data-close]')) closeModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

  const bar = (pct) => `<div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div>`;
  const typeIcon = (t) => ({ SOP: '📋', Policy: '📜', Manual: '📘', 'Quick Reference': '📎', 'Process / Workflow': '🔀', Directory: '📇', Form: '📝', Video: '🎬', 'Decision Map': '🧭', Glossary: '🔤' }[t] || '📄');

  /* ---------- chrome ---------- */
  function renderChrome(route) {
    const me = S.me();
    const todo = S.todo(me).length;
    const items = [['learn', 'Learn', todo ? `<span class="count">${todo}</span>` : ''], ['know', 'Know', ''], ['ask', 'Ask', '']];
    if (S.canSeeTeam(me)) items.push(['team', 'My Team', '']);
    if (S.isAdmin(me)) items.push(['manage', 'Manage', '']);
    $('#mainnav').innerHTML = items.map(([k, label, extra]) => `<a href="#/${k}" class="${route[0] === k ? 'active' : ''}">${label}${extra}</a>`).join('');
    const roleLabel = { employee: 'Employee', supervisor: 'Supervisor', admin: 'L&D Admin' };
    $('#userSwitch').innerHTML = S.state.users.map((u) => `<option value="${u.id}" ${u.id === me.id ? 'selected' : ''}>${esc(u.name)} — ${roleLabel[u.role]}, ${esc(S.dept(u.dept))}${u.sme ? ' (SME)' : ''}</option>`).join('');

  $('#userSwitch').addEventListener('change', (e) => {
    S.setMe(e.target.value);
    const me = S.me();
    if (location.hash.startsWith('#/manage') && !S.isAdmin(me)) location.hash = '#/learn';
    else if (location.hash.startsWith('#/team') && !S.canSeeTeam(me)) location.hash = '#/learn';

    toast('Viewing as ' + me.name);
  });
  $('#resetDemo').addEventListener('click', () => { S.reset(); askLog = []; route(); toast('Demo reset'); });
  $('#suggestBtn').addEventListener('click', () => suggestModal());

  function suggestModal(prefill = '', type = 'question') {
    const me = S.me();
    openModal(`
      <h2 id="modalTitle">Submit a request</h2>
      <div class="field"><label for="sType">What is it?</label>
        <select id="sType">
          <option value="question" ${type === 'question' ? 'selected' : ''}>A question</option>
          <option value="topic" ${type === 'topic' ? 'selected' : ''}>A topic idea</option>

        </select></div>
      <div class="field"><label for="sText">Details</label><textarea id="sText">${esc(prefill)}</textarea></div>
      <div class="row end"><button class="btn btn-ghost" data-close type="button">Cancel</button><button class="btn" id="sSend" type="button">Send</button></div>`, (card) => {
      $('#sSend', card).addEventListener('click', () => {
        const text = $('#sText', card).value.trim();

  /* =========================================================================
     LEARN
     ========================================================================= */
  const itemRow = (it) => it.kind === 'update'
    ? `<a class="list-row" href="#/learn/update/${it.x.doc.id}"><span class="row-ico warn">!</span>
        <span class="grow"><strong>${esc(it.x.doc.title)}</strong><span class="sub">Update · v${esc(it.x.version.v)} · 2 min</span></span><span class="btn btn-sm">Review</span></a>`
    : `<a class="list-row" href="#/learn/module/${it.m.id}"><span class="row-ico">${it.m.stage === 'ongoing' ? '★' : '▶'}</span>
        <span class="grow"><strong>${esc(it.m.title)}</strong><span class="sub">${S.STAGE_LABEL[it.m.stage]} · ${it.m.minutes} min</span></span><span class="btn btn-sm btn-ghost">Start</span></a>`;

  function viewLearn() {
    const me = S.me();
    const p = S.progress(me);
    const todo = S.todo(me);
    const doneMods = S.requiredModules(me).filter((m) => S.done(me.id, 'module', m.id));
    const doneUps = S.requiredUpdates(me).filter((x) => S.done(me.id, 'update', x.ref));

    return `

      </div>

      ${todo.length ? `<div class="card list">${todo.map(itemRow).join('')}</div>` : `<div class="card empty">You're all caught up ✓</div>`}
      ${doneCount ? `<details class="card list completed">
        <summary>Completed (${doneCount})</summary>
        ${doneUps.map((x) => `<a class="list-row" href="#/learn/update/${x.doc.id}"><span class="row-ico ok">✓</span><span class="grow">${esc(x.doc.title)}<span class="sub">Update v${esc(x.version.v)} · ${fmtDate(S.done(me.id, 'update', x.ref).date)}</span></span></a>`).join('')}
        ${doneMods.map((m) => `<a class="list-row" href="#/learn/module/${m.id}"><span class="row-ico ok">✓</span><span class="grow">${esc(m.title)}<span class="sub">${fmtDate(S.done(me.id, 'module', m.id).date)}</span></span></a>`).join('')}
      </details>` : ''}
      <p class="small center"><a href="#/learn/record">My learning record</a></p>`;

  /* ---------- module player ---------- */
  let quizAnswers = {};
  function viewModule(id, stepStr) {
    const me = S.me();
    const m = S.mod(id);
    if (!m) return notFound();
    const docs = m.docs.map(S.doc).filter((d) => d && d.status === 'active');
    const total = docs.length + 1;
    const step = Math.min(Math.max(parseInt(stepStr || '0', 10) || 0, 0), total - 1);
    const isQuiz = step === docs.length;
    const head = `<div class="player-head"><a href="#/learn" class="small">← Learn</a>
        <div class="row spread"><strong>${esc(m.title)}</strong><span class="muted small">${isQuiz ? 'Quiz' : 'Lesson ' + (step + 1) + ' of ' + docs.length}</span></div>
        ${bar(Math.round((step / (total - 1)) * 100))}</div>`;
    if (isQuiz) return `<div class="narrow">${head}<article class="card">${quizView(m, me)}</article></div>`;
    const d = docs[step], v = S.current(d);
    return `<div class="narrow">${head}
      <article class="card">
        <h1>${esc(d.title)}</h1>
        <p class="meta">v${esc(v.v)} · ${fmtDate(v.date)} · <a href="#/know/doc/${d.id}">Open in Know</a></p>
        <div class="doc-body">${docBody(v)}</div>
      </article>
      <div class="row spread nav-btns">
        ${step > 0 ? `<a class="btn btn-ghost" href="#/learn/module/${m.id}/${step - 1}">Back</a>` : '<span></span>'}
        <a class="btn" href="#/learn/module/${m.id}/${step + 1}">${step + 1 === docs.length ? 'Take the quiz' : 'Next'}</a>
      </div></div>`;
  }

  function quizView(m, me) {
    const st = quizAnswers[m.id] || (quizAnswers[m.id] = { picks: {}, submitted: false });
    const qs = m.quiz.map((q, qi) => `
      <div class="quiz-q"><p><strong>${esc(q.q)}</strong></p>
        ${q.options.map((o, oi) => {
          let cls = '';
          if (st.submitted) { if (oi === q.a) cls = 'correct'; else if (st.picks[qi] === oi) cls = 'wrong'; }
          return `<label class="opt ${cls}"><input type="radio" name="q${qi}" value="${oi}" ${st.picks[qi] === oi ? 'checked' : ''} ${st.submitted ? 'disabled' : ''}> ${esc(o)}</label>`;
        }).join('')}
        ${st.submitted && st.picks[qi] !== q.a ? `<p class="small">See <a href="#/know/doc/${q.docRef}">${esc(S.doc(q.docRef).title)}</a></p>` : ''}
      </div>`).join('');
    let result = '';
    if (st.submitted) {
      const score = Math.round((m.quiz.filter((q, i) => st.picks[i] === q.a).length / m.quiz.length) * 100);
      result = score >= 80
        ? `<div class="result ok"><strong>Passed ✓</strong> <a class="btn btn-sm" href="#/learn">Back to Learn</a></div>`
        : `<div class="result warn"><strong>${score}% — try again</strong> <button class="btn btn-sm" id="retry" type="button">Retry</button></div>`;
    }
    return `<h1>Quiz</h1><form id="quizForm">${qs}</form>${result || '<button class="btn" id="submitQuiz" type="button">Submit</button>'}`;
  }
  function bindModule(id) {
    const me = S.me(); const m = S.mod(id); if (!m) return;
    const st = quizAnswers[m.id];
    const form = $('#quizForm');
    if (form) form.addEventListener('change', (e) => { if (e.target.name) st.picks[+e.target.name.slice(1)] = +e.target.value; });
    const sub = $('#submitQuiz');
    if (sub) sub.addEventListener('click', () => {
      if (Object.keys(st.picks).length < m.quiz.length) { toast('Answer every question'); return; }
      st.submitted = true;
      const score = Math.round((m.quiz.filter((q, i) => st.picks[i] === q.a).length / m.quiz.length) * 100);
      if (score >= 80) { S.complete(me.id, 'module', m.id, score); toast('Module complete ✓'); }
      rerender();
    });
    const retry = $('#retry');
    if (retry) retry.addEventListener('click', () => { quizAnswers[m.id] = { picks: {}, submitted: false }; rerender(); });
  }

  /* ---------- update acknowledgement ---------- */
  function viewUpdate(docId) {
    const me = S.me();
    const d = S.doc(docId); if (!d) return notFound();
    const v = S.current(d);
    const prev = prevVersion(d, v);
    const done = S.done(me.id, 'update', d.id + '@' + v.v);
    return `<div class="narrow"><a href="#/learn" class="small">← Learn</a>
      <article class="card stack">
        <div><span class="badge warn">Update</span><h1>${esc(d.title)}</h1><p class="meta">v${esc(v.v)} · ${fmtDate(v.date)}</p></div>
        <div class="changes"><strong>What changed</strong><p>${esc(v.summary)}</p></div>
        ${prev ? `<details><summary>Show exact changes</summary><div class="doc-body diff">${sectionDiff(prev, v)}</div></details>` : ''}
        <p><a href="#/know/doc/${d.id}">Open the full document</a></p>
        ${done ? `<div class="result ok">✓ Acknowledged ${fmtDate(done.date)}</div>`
          : `<label class="opt"><input type="checkbox" id="ackBox"> I've read and understand these changes</label>
             <button class="btn" id="ackBtn" type="button" disabled>Acknowledge</button>`}
      </article></div>`;
  }
  function bindUpdate(docId) {
    const box = $('#ackBox'), btn = $('#ackBtn');
    if (!box) return;
    box.addEventListener('change', () => { btn.disabled = !box.checked; });
    btn.addEventListener('click', () => {
      const d = S.doc(docId), v = S.current(d);
      S.complete(S.me().id, 'update', d.id + '@' + v.v);
      toast('Acknowledged ✓'); location.hash = '#/learn';
    });
  }

  /* ---------- learning record ---------- */
  function recordTable(u) {
    const rows = S.transcript(u).map((c) => {
      let title, type;
      if (c.kind === 'module') { const m = S.mod(c.ref); title = m ? m.title : c.ref; type = 'Module'; }
      else { const [docId, v] = c.ref.split('@'); const d = S.doc(docId); title = (d ? d.title : docId) + ' v' + v; type = 'Update'; }
      return `<tr><td class="nowrap">${fmtDate(c.date)}</td><td>${esc(title)}</td><td>${type}</td><td>${c.score != null ? c.score + '%' : ''}</td></tr>`;
    }).join('');
    return `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Item</th><th>Type</th><th>Score</th></tr></thead><tbody>${rows || '<tr><td colspan="4" class="muted">Nothing yet.</td></tr>'}</tbody></table></div>`;
  }
  function viewRecord() {
    const me = S.me();
    return `<a href="#/learn" class="small">← Learn</a><h1>My learning record</h1>
      ${me.deptHistory.length ? `<p class="muted small">Previously: ${me.deptHistory.map((h) => esc(S.dept(h.dept))).join(', ')}</p>` : ''}
      <div class="card">${recordTable(me)}</div>`;

  /* =========================================================================
     KNOW
     ========================================================================= */
  let knowQuery = '';
  const fileRow = (d, snippet) => {
    const v = S.current(d);
    return `<a class="list-row" href="#/know/doc/${d.id}"><span class="row-ico plain">${typeIcon(d.type)}</span>
      <span class="grow"><strong>${esc(d.title)}</strong><span class="sub">${snippet || esc(d.type)}</span></span>
      <span class="muted small nowrap">${fmtDate(v.date)}</span></a>`;
  };
  function viewKnow() {
    const me = S.me();
    const docs = S.visibleDocs(me);
    const recent = docs.slice().sort((a, b) => (S.current(a).date < S.current(b).date ? 1 : -1)).slice(0, 5);
    return `
      <div class="search-big"><input type="search" id="knowSearch" placeholder="Search documents" value="${esc(knowQuery)}" aria-label="Search documents"></div>
      <div id="knowResults"></div>
      <div id="knowBrowse">
        <div class="tiles">${S.state.folders.map((f) => {
          const n = docs.filter((d) => d.folder === f.id).length;
          return n ? `<a class="tile" href="#/know/f/${f.id}"><span class="tile-ico">${f.icon}</span><strong>${esc(f.name)}</strong><span class="muted small">${n} document${n === 1 ? '' : 's'}</span></a>` : '';
        }).join('')}</div>
        <h2 class="section-title">Recently updated</h2>
        <div class="card list">${recent.map((d) => fileRow(d)).join('')}</div>
      </div>`;
  }
  function viewFolder(fid) {
    const f = S.folder(fid); if (!f) return notFound();
    const docs = S.visibleDocs(S.me()).filter((d) => d.folder === fid).sort((a, b) => a.title.localeCompare(b.title));
    return `<a href="#/know" class="small">← Know</a>
      <h1>${f.icon} ${esc(f.name)}</h1>
      <div class="card list">${docs.map((d) => fileRow(d)).join('') || '<div class="empty">Nothing here for your team.</div>'}</div>`;
  }
  function bindKnow() {
    const input = $('#knowSearch');
    const run = () => {
      knowQuery = input.value;
      const q = knowQuery.trim().toLowerCase();
      const res = $('#knowResults'), browse = $('#knowBrowse');
      if (!q) { res.innerHTML = ''; browse.hidden = false; return; }
      browse.hidden = true;
      const words = q.split(/\s+/).filter(Boolean);
      const hits = S.visibleDocs(S.me()).map((d) => {
        const v = S.current(d);
        const hay = (d.title + ' ' + d.tags.join(' ') + ' ' + d.type + ' ' + v.sections.map((s) => s.h + ' ' + s.body).join(' ')).toLowerCase();
        if (!words.every((w) => hay.includes(w))) return null;
        const score = words.reduce((a, w) => a + 1 + (d.title.toLowerCase().includes(w) ? 3 : 0), 0);
        const sec = v.sections.find((s) => words.some((w) => (s.h + ' ' + s.body).toLowerCase().includes(w)) && !/^Placeholder/.test(s.body));
        let snippet = '';
        if (sec) {
          const p = plain(sec.body).replace(/\n/g, ' ');
          const at = Math.max(0, p.toLowerCase().indexOf(words.find((w) => p.toLowerCase().includes(w)) || '') - 30);
          snippet = esc((at ? '…' : '') + p.slice(at, at + 110) + (p.length > at + 110 ? '…' : ''));
          words.forEach((w) => { snippet = snippet.replace(new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>'); });
        }
        return { d, score, snippet };
      }).filter(Boolean).sort((a, b) => b.score - a.score);
      res.innerHTML = hits.length
        ? `<div class="card list">${hits.map((h) => fileRow(h.d, h.snippet)).join('')}</div>`
        : `<div class="card empty">No results. <button class="link-btn" id="noResSuggest" type="button">Request this document</button></div>`;
      const nr = $('#noResSuggest'); if (nr) nr.addEventListener('click', () => suggestModal('I searched for "' + knowQuery + '" and couldn\'t find anything.', 'request'));
    };
    input.addEventListener('input', run);
    if (knowQuery) run();
  }

  function viewDoc(id) {
    const me = S.me();
    const d = S.doc(id);
    if (!d || !S.visibleDocs(me).includes(d)) return `<div class="card empty">This document isn't available. <a href="#/know">Back to Know</a></div>`;
    const v = S.current(d);
    const f = S.folder(d.folder);
    const related = d.links.map(S.doc).filter((x) => x && S.visibleDocs(me).includes(x));
    const history = d.versions.filter((x) => x.status !== 'draft').slice().reverse();
    return `<div class="narrow"><a href="#/know/f/${f.id}" class="small">← ${esc(f.name)}</a>
      <article class="card">
        <h1>${esc(d.title)}</h1>
        <p class="meta">${esc(d.type)} · v${esc(v.v)} · Updated ${fmtDate(v.date)}</p>
        <div class="row doc-actions">
          <button class="btn btn-sm btn-ghost" type="button" onclick="window.print()">⤓ PDF</button>
          <button class="btn btn-sm btn-ghost" id="docQuestion" type="button">Question?</button>
          ${S.isAdmin(me) ? `<a class="btn btn-sm btn-ghost" href="#/manage/doc/${d.id}">Manage</a>` : ''}
        </div>
        <div class="doc-body">${docBody(v)}</div>
        ${related.length ? `<h3 class="related-h">Related</h3><div class="pill-row">${related.map((r) => `<a class="chip" href="#/know/doc/${r.id}">${esc(r.title)}</a>`).join('')}</div>` : ''}
        <details class="history"><summary>Version history</summary>
          <ul>${history.map((x) => `<li><strong>v${esc(x.v)}</strong> · ${fmtDate(x.date)} — ${esc(x.summary)}</li>`).join('')}</ul></details>
      </article></div>`;
  }

  }

  /* =========================================================================
     ASK (simulated)
     ========================================================================= */
  let askLog = [];
  const SUGGESTED = ['What is a memo?', 'Who approves a rush order?', 'What does the warranty cover?'];
  function answerHtml(r) {
    if (!r.found) return `<p>I couldn't find that in our documents, so I won't guess.</p>
      <button class="btn btn-sm btn-ghost send-ld" type="button">Send question to L&amp;D</button>`;
    const t = r.top;
    return `${md(t.s.body)}<p class="source">Source: <a href="#/know/doc/${t.d.id}">${esc(t.d.title)} › ${esc(t.s.h)}</a></p>`;
  }
  function viewAsk() {
    return `<div class="narrow ask">
      <div class="chat" id="chat" aria-live="polite">
        ${askLog.length ? '' : `<div class="ask-hello"><h1>What can I help you find?</h1><p class="muted">Answers come from our current documents, with a link to the source.</p></div>`}
        ${askLog.map((x) => `<div class="msg user">${esc(x.q)}</div><div class="msg bot" data-q="${esc(x.q)}">${answerHtml(x.r)}</div>`).join('')}
      </div>
      ${askLog.length ? '' : `<div class="pill-row center">${SUGGESTED.map((q) => `<button class="chip ask-chip" type="button">${esc(q)}</button>`).join('')}</div>`}
      <form class="chat-input" id="askForm"><input type="text" id="askInput" placeholder="Ask a question" aria-label="Your question" autocomplete="off"><button class="btn" type="submit">Ask</button></form>
      ${askLog.length ? '<p class="center small"><button class="link-btn" id="clearChat" type="button">Clear</button></p>' : ''}
    </div>`;
  }
  function bindAsk() {
    const go = (q) => { if (!q.trim()) return; askLog.push({ q, r: S.ask(S.me(), q) }); rerender(); setTimeout(() => { const c = $('#chat'); if (c.lastElementChild) c.lastElementChild.scrollIntoView({ block: 'nearest' }); $('#askInput').focus(); }, 20); };
    $('#askForm').addEventListener('submit', (e) => { e.preventDefault(); go($('#askInput').value); });
    $$('.ask-chip').forEach((b) => b.addEventListener('click', () => go(b.textContent)));
    const clr = $('#clearChat'); if (clr) clr.addEventListener('click', () => { askLog = []; rerender(); });
    $$('.send-ld').forEach((b) => b.addEventListener('click', () => {
      S.submit(S.me().id, 'question', b.closest('.msg').dataset.q + ' (from Ask — no answer found)');
      b.replaceWith(Object.assign(document.createElement('span'), { className: 'badge ok', textContent: '✓ Sent' }));
    }));
  }

  /* =========================================================================
     MY TEAM

  function viewMember(id) {

    return `<a href="#/team" class="small">← My Team</a>
